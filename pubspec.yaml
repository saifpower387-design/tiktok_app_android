name: tiktok_app
description: ST Video social video application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase packages must stay on compatible major versions.
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  cloud_functions: ^5.0.0

  # Supabase is used for video and profile-image storage.
  supabase_flutter: ^2.18.0

  google_mobile_ads: ^9.1.0
  audioplayers: ^6.8.1
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  camera: ^0.10.5+9
  video_player: ^2.9.2
  video_trimmer: ^2.1.0
  gal: ^2.3.0
  dio: ^5.7.0
  path_provider: ^2.1.5
  agora_rtc_engine: ^6.3.2
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
