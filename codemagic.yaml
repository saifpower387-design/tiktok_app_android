workflows:
  android-workflow:
    name: ST Video Android Firebase
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Create Android project
        script: |
          rm -rf android
          flutter create . --platforms=android

      - name: Configure Firebase Android
        script: |
          test -f google-services.json || { echo "google-services.json is missing"; exit 1; }
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          settings = Path('android/settings.gradle')
          text = settings.read_text()
          if 'com.google.gms.google-services' not in text:
              text = text.replace(
                  'plugins {',
                  'plugins {\n    id "com.google.gms.google-services" version "4.4.2" apply false',
                  1,
              )
              settings.write_text(text)
          app = Path('android/app/build.gradle')
          text = app.read_text()
          if 'com.google.gms.google-services' not in text:
              text = text.replace(
                  'plugins {',
                  'plugins {\n    id "com.google.gms.google-services"',
                  1,
              )
              app.write_text(text)
          PY

      - name: Add Agora permissions
        script: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'RECORD_AUDIO' not in text:
              perms = (
                  '    <uses-permission android:name="android.permission.INTERNET"/>\n'
                  '    <uses-permission android:name="android.permission.CAMERA"/>\n'
                  '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
                  '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n'
                  '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n'
                  '    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n'
              )
              text = text.replace('<application', perms + '    <application', 1)
              manifest.write_text(text)
          PY

      - name: Get packages
        script: flutter pub get

      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
