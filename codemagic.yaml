workflows:
  android-workflow:
    name: ST Video Android Firebase
    instance_type: mac_mini_m1

    environment:
      flutter: stable
      groups:
        - snap_camera_kit

    scripts:
      - name: Create Android project
        script: |
          set -e

          mkdir -p "$HOME/.android"

          test -f signing/debug.keystore || {
            echo "ERROR: signing/debug.keystore is missing from GitHub"
            exit 1
          }

          cp signing/debug.keystore "$HOME/.android/debug.keystore"

          rm -rf android
          flutter create . --platforms=android

          cp signing/debug.keystore "$HOME/.android/debug.keystore"

      - name: Configure Snap Camera Kit Android integration
        script: |
          set -e

          : "${SNAP_CAMERA_KIT_API_TOKEN:?Missing SNAP_CAMERA_KIT_API_TOKEN in Codemagic Environment variables}"
          : "${SNAP_CAMERA_KIT_GROUP_ID:?Missing SNAP_CAMERA_KIT_GROUP_ID in Codemagic Environment variables}"

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          token = os.environ['SNAP_CAMERA_KIT_API_TOKEN']
          group_id = os.environ['SNAP_CAMERA_KIT_GROUP_ID']

          kotlin_root = Path('android/app/src/main/kotlin')
          main_activity = next(kotlin_root.rglob('MainActivity.kt'), None)

          if main_activity is None:
              raise SystemExit('Flutter did not generate MainActivity.kt')

          package = '.'.join(main_activity.relative_to(kotlin_root).parts[:-1])

          token_literal = json.dumps(token)
          group_literal = json.dumps(group_id)
          channel_literal = json.dumps('st_video/snap_camera')

          source = f'''package {package}

          import android.widget.Toast
          import androidx.core.net.toFile
          import io.flutter.embedding.android.FlutterFragmentActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import com.snap.camerakit.support.app.CameraActivity

          class MainActivity : FlutterFragmentActivity() {{
              private val cameraKitApiToken = {token_literal}
              private val cameraKitGroupId = {group_literal}
              private val channelName = {channel_literal}
              private var pendingResult: MethodChannel.Result? = null

              private val captureLauncher =
                  registerForActivityResult(CameraActivity.Capture) {{ captureResult ->
                      val result = pendingResult
                      pendingResult = null

                      when (captureResult) {{
                          is CameraActivity.Capture.Result.Success.Video ->
                              result?.success(
                                  mapOf(
                                      "path" to captureResult.uri.toFile().absolutePath,
                                      "mime_type" to "video"
                                  )
                              )

                          is CameraActivity.Capture.Result.Success.Image ->
                              result?.success(
                                  mapOf(
                                      "path" to captureResult.uri.toFile().absolutePath,
                                      "mime_type" to "image"
                                  )
                              )

                          is CameraActivity.Capture.Result.Cancelled -> {{
                              Toast.makeText(
                                  this,
                                  "تم إلغاء التصوير",
                                  Toast.LENGTH_SHORT
                              ).show()

                              result?.error(
                                  "CANCELLED",
                                  "تم إلغاء التصوير",
                                  null
                              )
                          }}

                          is CameraActivity.Capture.Result.Failure ->
                              result?.error(
                                  "CAMERA_KIT_FAILURE",
                                  "فشل تشغيل Camera Kit",
                                  null
                              )
                      }}
                  }}

              override fun configureFlutterEngine(
                  flutterEngine: FlutterEngine
              ) {{
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      channelName
                  ).setMethodCallHandler {{ call, result ->

                      if (call.method != "openCameraKitLenses") {{
                          result.notImplemented()
                          return@setMethodCallHandler
                      }}

                      if (pendingResult != null) {{
                          result.error(
                              "BUSY",
                              "كاميرا Snap مفتوحة بالفعل",
                              null
                          )
                          return@setMethodCallHandler
                      }}

                      pendingResult = result

                      captureLauncher.launch(
                          CameraActivity.Configuration.WithLenses(
                              cameraKitApiToken = cameraKitApiToken,
                              lensGroupIds = arrayOf(cameraKitGroupId)
                          )
                      )
                  }}
              }}
          }}
          '''

          main_activity.write_text(source)
          print(f'Wrote Camera Kit MainActivity: {main_activity}')

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()

          permissions = '''    <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
          '''

          if 'android.permission.CAMERA' not in text:
              text = text.replace(
                  '<application',
                  permissions + '    <application',
                  1
              )

          admob_meta = '''        <meta-data
              android:name="com.google.android.gms.ads.APPLICATION_ID"
              android:value="ca-app-pub-5663628720448893~5879440187" />
          '''

          if 'com.google.android.gms.ads.APPLICATION_ID' not in text:
              application_start = text.find('<application')
              application_open_end = text.find('>', application_start)

              if application_start < 0 or application_open_end < 0:
                  raise SystemExit(
                      'Could not find a valid application tag in AndroidManifest.xml'
                  )

              text = (
                  text[:application_open_end + 1]
                  + '\n'
                  + admob_meta
                  + text[application_open_end + 1:]
              )

          manifest.write_text(text)

          gradle = next(Path('android/app').glob('build.gradle*'), None)

          if gradle is None:
              raise SystemExit('Flutter app Gradle file not found')

          text = gradle.read_text()

          dependency = (
              '    implementation("com.snap.camerakit:support-camera-activity:1.26.0")\n'
              if gradle.suffix == '.kts'
              else '    implementation "com.snap.camerakit:support-camera-activity:1.26.0"\n'
          )

          if 'com.snap.camerakit:support-camera-activity' not in text:
              if 'dependencies {' in text:
                  text = text.replace(
                      'dependencies {',
                      'dependencies {\n' + dependency,
                      1
                  )
              else:
                  text += (
                      '\n\ndependencies {\n'
                      + dependency
                      + '}\n'
                  )

          if 'sourceCompatibility' not in text:
              if gradle.suffix == '.kts':
                  options = '''
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_1_8
                  targetCompatibility = JavaVersion.VERSION_1_8
              }
          '''
              else:
                  options = '''
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          '''

              text = text.replace(
                  'android {',
                  'android {' + options,
                  1
              )

          gradle.write_text(text)
          print(f'Added Camera Kit dependency: {gradle}')
          PY

      - name: Apply ST app icon
        script: |
          set -e

          icon_root="assets/app_icon"

          test -f "$icon_root/app_icon.png" || {
            echo "App icon assets are missing"
            exit 1
          }

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            target="android/app/src/main/res/mipmap-$density"

            mkdir -p "$target"

            cp "$icon_root/mipmap-$density/ic_launcher.png" \
              "$target/ic_launcher.png"

            cp "$icon_root/mipmap-$density/ic_launcher_round.png" \
              "$target/ic_launcher_round.png"
          done

          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

          echo "Applied professional S/T launcher icon"

      - name: Force fixed Android signing key
        script: |
          set -e

          test -f signing/debug.keystore || {
            echo "signing/debug.keystore is missing from the repository"
            exit 1
          }

          cp signing/debug.keystore "$HOME/.android/debug.keystore"
          cp signing/debug.keystore android/app/debug.keystore

          python3 - <<'PY'
          from pathlib import Path

          paths = list(Path('android/app').glob('build.gradle*'))

          if not paths:
              raise SystemExit('Android app Gradle file not found')

          path = paths[0]
          text = path.read_text()

          if path.suffix == '.kts':
              signing = '''
              signingConfigs {
                  getByName("debug") {
                      storeFile = rootProject.file("../signing/debug.keystore")
                      storePassword = "android"
                      keyAlias = "androiddebugkey"
                      keyPassword = "android"
                  }
              }
          '''

              marker = 'rootProject.file("../signing/debug.keystore")'

          else:
              signing = '''
              signingConfigs {
                  debug {
                      storeFile file("../signing/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          '''

              marker = 'file("../signing/debug.keystore")'

          if marker not in text:
              text = text.replace(
                  'android {',
                  'android {' + signing,
                  1
              )

          if path.suffix == '.kts':
              assignment = '''
              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
          '''

          else:
              assignment = '''
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          '''

          if (
              'signingConfig = signingConfigs.getByName("debug")' not in text
              and 'signingConfig signingConfigs.debug' not in text
          ):
              text = text.replace(
                  '\n}',
                  assignment + '\n}',
                  1
              )

          path.write_text(text)

          print(f'Gradle debug signing fixed to repository keystore: {path}')
          PY

      - name: Generate Google OAuth fingerprints
        script: |
          mkdir -p "$HOME/.android"

          test -f signing/debug.keystore || {
            echo "signing/debug.keystore is missing"
            exit 1
          }

          cp signing/debug.keystore "$HOME/.android/debug.keystore"

          echo "Copy these values to Firebase Project settings:"

          keytool -list -v \
            -alias androiddebugkey \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android | grep -E "SHA1:|SHA256:"

      - name: Fix Gradle wrapper version
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          wrapper = Path(
              'android/gradle/wrapper/gradle-wrapper.properties'
          )

          if not wrapper.exists():
              raise SystemExit(f'Missing Gradle wrapper: {wrapper}')

          text = wrapper.read_text()

          text, count = re.subn(
              r'distributionUrl=.*',
              'distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip',
              text
           )

          if count != 1:
              raise SystemExit(
                  'Could not update Gradle distributionUrl'
              )

          wrapper.write_text(text)
          print('Gradle wrapper set to 9.3.1')
          PY

      - name: Update Android SDK versions in build.gradle
        script: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          for gradle_path in Path('android/app').glob('build.gradle*'):
              content = gradle_path.read_text()

              content = re.sub(
                  r'compileSdk(Version)?\s*=?\s*.*',
                  'compileSdk = 36',
                  content
              )

              content = re.sub(
                  r'targetSdk(Version)?\s*=?\s*.*',
                  'targetSdk = 36',
                  content
              )

              content = re.sub(
                  r'minSdk(Version)?\s*=?\s*.*',
                  'minSdk = 24',
                  content
              )

              gradle_path.write_text(content)
              print(f"Successfully updated {gradle_path}")
          PY

      - name: Configure Firebase Android
        script: |
          test -f google-services.json || {
            echo "google-services.json is missing"
            exit 1
          }

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(
              Path('google-services.json').read_text()
          )

          clients = data.get('client', [])

          android = [
              c for c in clients
              if c.get('client_info', {})
              .get('android_client_info', {})
              .get('package_name')
              == 'com.example.tiktok_app'
          ]

          if not android:
              raise SystemExit(
                  'google-services.json package mismatch'
              )

          oauth = android[0].get('oauth_client', [])

          if not any(c.get('client_type') == 1 for c in oauth):
              raise SystemExit(
                  'google-services.json has no Android OAuth client'
              )

          if not any(c.get('client_type') == 3 for c in oauth):
              raise SystemExit(
                  'google-services.json has no Web OAuth client'
              )

          print(
              'Firebase package and Android/Web OAuth clients verified'
          )
          PY

          cp google-services.json android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          def first_existing(*names):
              for name in names:
                  path = Path(name)

                  if path.exists():
                      return path

              raise SystemExit(
                  "Missing gradle file: " + " or ".join(names)
              )

          def add_plugin(path, groovy_line, kts_line):
              text = path.read_text()

              if 'com.google.gms.google-services' in text:
                  return

              line = (
                  kts_line
                  if path.suffix == '.kts'
                  else groovy_line
              )

              text = text.replace(
                  'plugins {',
                  'plugins {\n' + line,
                  1
              )

              path.write_text(text)

          add_plugin(
              first_existing(
                  'android/settings.gradle.kts',
                  'android/settings.gradle'
              ),
              '    id "com.google.gms.google-services" version "4.4.2" apply false',
              '    id("com.google.gms.google-services") version "4.4.2" apply false',
          )

          add_plugin(
              first_existing(
                  'android/app/build.gradle.kts',
                  'android/app/build.gradle'
              ),
              '    id "com.google.gms.google-services"',
              '    id("com.google.gms.google-services")',
          )
          PY

      - name: Add Agora permissions
        script: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              'android/app/src/main/AndroidManifest.xml'
          )

          text = manifest.read_text()

          if 'RECORD_AUDIO' not in text:
              perms = (
                  '    <uses-permission android:name="android.permission.INTERNET"/>\n'
                  '    <uses-permission android:name="android.permission.CAMERA"/>\n'
                  '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
                  '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n'
                  '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n'
                  '    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n'
              )

              text = text.replace(
                  '<application',
                  perms + '    <application',
                  1
              )

              manifest.write_text(text)
          PY

      - name: Get packages
        script: flutter pub get

      - name: Fix Agora compileSdk
        script: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          candidates = list(
              Path.home().glob(
                  '.pub-cache/hosted/**/agora_rtc_engine-*/android/build.gradle*'
              )
          )

          if not candidates:
              raise SystemExit(
                  'Could not find Agora Android Gradle file'
              )

          changed = False

          for path in candidates:
              text = path.read_text()

              if path.suffix == '.kts':
                  updated = re.sub(
                      r'(?m)^(\s*)compileSdk\s*=.*$',
                      r'\1compileSdk = 36',
                      text
                  )
              else:
                  updated = re.sub(
                      r'(?m)^(\s*)compileSdk(?:Version)?\s+.*$',
                      r'\1compileSdkVersion 36',
                      text
                  )

              if updated != text:
                  changed = True
                  path.write_text(updated)
                  print(f'Updated Agora compileSdk: {path}')
              else:
                  print(f'No compileSdk change needed in: {path}')

          if not changed:
              raise SystemExit(
                  'Agora compileSdk was not changed; inspect the package Gradle file'
              )
          PY

      - name: Force iris_method_channel compileSdk 36
        script: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          files = list(
              Path.home().glob(
                  '.pub-cache/hosted/**/iris_method_channel-*/android/build.gradle*'
              )
          )

          if not files:
              raise SystemExit(
                  'iris_method_channel Gradle file not found'
              )

          for path in files:
              text = path.read_text()

              if path.suffix == '.kts':
                  updated = re.sub(
                      r'(?m)^(\s*)compileSdk\s*=.*$',
                      r'\1compileSdk = 36',
                      text
                  )
              else:
                  updated = re.sub(
                      r'(?m)^(\s*)compileSdkVersion\s+.*$',
                      r'\1compileSdkVersion 36',
                      text
                  )

              if updated == text:
                  raise SystemExit(
                      f'Could not update compileSdk in {path}'
                  )

              path.write_text(updated)
              print(f'Updated iris_method_channel: {path}')

              for line_number, line in enumerate(
                  updated.splitlines(),
                  1
              ):
                  if 'compileSdk' in line:
                      print(f'{line_number}: {line}')
          PY

      - name: Build debug APK
        script: |
          set +e

          flutter build apk --debug 2>&1 | tee /tmp/flutter_build.log

          BUILD_STATUS=${PIPESTATUS[0]}

          echo ""
          echo "========== FLUTTER ERROR SUMMARY =========="

          grep -n -E '(^|:) Error:|lib/[^:]+:[0-9]+:[0-9]+|Unhandled exception|Target kernel_snapshot' /tmp/flutter_build.log | tail -80 || true

          echo "========== END FLUTTER ERROR SUMMARY =========="

          exit "$BUILD_STATUS"

      - name: Verify APK signing fingerprint
        script: |
          set -e

          APK="build/app/outputs/flutter-apk/app-debug.apk"

          test -f "$APK" || {
            echo "APK was not created"
            exit 1
          }

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)

          test -x "$APKSIGNER" || {
            echo "Android apksigner was not found"
            exit 1
          }

          echo "The APK was signed with this certificate; these exact values must exist in Firebase:"

          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"

          NORMALIZED=$(echo "$CERTS" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')

          echo "$NORMALIZED" | grep -q "1f2335685da1be46dca956de4e509b0b7ea04422" || {
            echo "ERROR: APK was not signed with the fixed Firebase key"
            exit 1
          }

          echo "Fixed Firebase signing key verified successfully"

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
