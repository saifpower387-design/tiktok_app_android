
workflows:
  android-workflow:
    name: ST Video Android Firebase
    instance_type: mac_mini_m1

    environment:
      flutter: stable

    scripts:
      - name: Create Android project
        script: |
          set -e
          mkdir -p "$HOME/.android"

          test -f signing/debug.keystore || {
            echo "ERROR: signing/debug.keystore is missing from GitHub"
            exit 1
          }

          cp signing/debug.keystore "$HOME/.android/debug.keystore"
          rm -rf android
          flutter create . --platforms=android
          cp signing/debug.keystore "$HOME/.android/debug.keystore"

      - name: Configure Android
        script: |
          set -e
          python3 tool/android_setup.py

      - name: Generate Google OAuth fingerprints
        script: |
          set -e
          mkdir -p "$HOME/.android"

          test -f signing/debug.keystore || {
            echo "signing/debug.keystore is missing"
            exit 1
          }

          cp signing/debug.keystore "$HOME/.android/debug.keystore"

          echo "Copy these values to Firebase Project settings:"
          keytool -list -v \
            -alias androiddebugkey \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android | grep -E "SHA1:|SHA256:"

      - name: Get packages
        script: |
          set -e
          flutter pub get

      - name: Fix ffmpeg_kit_min_gpl namespace
        script: |
          set -e
          python3 - <<'PY'
          import re
          from pathlib import Path

          files = list(
              Path.home().glob(
                  '.pub-cache/hosted/**/ffmpeg_kit_min_gpl-*/android/build.gradle'
              )
          )

          if not files:
              raise SystemExit(
                  'ERROR: ffmpeg_kit_min_gpl Android build.gradle was not found. '
                  'Check pubspec.yaml and flutter pub get output.'
              )

          for path in files:
              text = path.read_text()

              if re.search(r'(?m)^\s*namespace\s+', text):
                  print(f'Namespace already exists: {path}')
                  continue

              manifest = path.parent / 'src/main/AndroidManifest.xml'

              if not manifest.exists():
                  raise SystemExit(
                      f'ERROR: AndroidManifest.xml not found: {manifest}'
                  )

              manifest_text = manifest.read_text()
              package_match = re.search(
                  r'<manifest\b[^>]*\bpackage=["\']([^"\']+)["\']',
                  manifest_text
              )

              if not package_match:
                  raise SystemExit(
                      f'ERROR: Could not read package name from {manifest}'
                  )

              android_block = re.search(
                  r'(?m)^(\s*)android\s*\{\s*$',
                  text
              )

              if not android_block:
                  raise SystemExit(
                      f'ERROR: Could not find android {{ block in {path}'
                  )

              indent = android_block.group(1) + '    '
              namespace_line = (
                  f"\n{indent}namespace '{package_match.group(1)}'"
              )

              text = (
                  text[:android_block.end()]
                  + namespace_line
                  + text[android_block.end():]
              )

              path.write_text(text)
              print(
                  f'Added namespace {package_match.group(1)} to {path}'
              )
          PY

      - name: Fix Agora compileSdk
        script: |
          set -e
          python3 - <<'PY'
          import re
          from pathlib import Path

          candidates = list(
              Path.home().glob(
                  '.pub-cache/hosted/**/agora_rtc_engine-*/android/build.gradle*'
              )
          )

          if not candidates:
              raise SystemExit('Could not find Agora Android Gradle file')

          changed = False

          for path in candidates:
              text = path.read_text()

              if path.suffix == '.kts':
                  updated = re.sub(
                      r'(?m)^(\s*)compileSdk\s*=.*$',
                      r'\1compileSdk = 36',
                      text,
                  )
              else:
                  updated = re.sub(
                      r'(?m)^(\s*)compileSdk(?:Version)?\s+.*$',
                      r'\1compileSdkVersion 36',
                      text,
                  )

              if updated != text:
                  changed = True
                  path.write_text(updated)
                  print(f'Updated Agora compileSdk: {path}')
              else:
                  print(f'No compileSdk change needed in: {path}')

          if not changed:
              raise SystemExit(
                  'Agora compileSdk was not changed; inspect the package Gradle file'
              )
          PY

      - name: Force iris_method_channel compileSdk 36
        script: |
          set -e
          python3 - <<'PY'
          import re
          from pathlib import Path

          files = list(
              Path.home().glob(
                  '.pub-cache/hosted/**/iris_method_channel-*/android/build.gradle*'
              )
          )

          if not files:
              raise SystemExit('iris_method_channel Gradle file not found')

          for path in files:
              text = path.read_text()

              if path.suffix == '.kts':
                  updated = re.sub(
                      r'(?m)^(\s*)compileSdk\s*=.*$',
                      r'\1compileSdk = 36',
                      text,
                  )
              else:
                  updated = re.sub(
                      r'(?m)^(\s*)compileSdkVersion\s+.*$',
                      r'\1compileSdkVersion 36',
                      text,
                  )

              if updated == text:
                  raise SystemExit(
                      f'Could not update compileSdk in {path}'
                  )

              path.write_text(updated)
              print(f'Updated iris_method_channel: {path}')
          PY

      - name: Build debug APK
        script: |
          set -e
          flutter build apk --debug

      - name: Verify APK signing fingerprint
        script: |
          set -e
          APK="build/app/outputs/flutter-apk/app-debug.apk"

          test -f "$APK" || {
            echo "APK was not created"
            exit 1
          }

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)

          test -x "$APKSIGNER" || {
            echo "Android apksigner was not found"
            exit 1
          }

          echo "APK signing certificate:"
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"

          NORMALIZED=$(echo "$CERTS" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')

          echo "$NORMALIZED" | grep -q "1f2335685da1be46dca956de4e509b0b7ea04422" || {
            echo "ERROR: APK was not signed with the fixed Firebase key"
            exit 1
          }

          echo "Fixed Firebase signing key verified successfully"

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
