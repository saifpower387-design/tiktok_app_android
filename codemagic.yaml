      - name: Fix Agora compileSdk
        script: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          candidates = list(
              Path.home().glob(
                  '.pub-cache/hosted/**/agora_rtc_engine-*/android/build.gradle*'
              )
          )

          if not candidates:
              raise SystemExit('Could not find Agora Android Gradle file')

          changed = False

          for path in candidates:
              text = path.read_text()

              if path.suffix == '.kts':
                  replacement = 'compileSdk = 36'
              else:
                  replacement = 'compileSdkVersion 36'

              updated = re.sub(
                  r'compileSdk(?:Version)?\s*(?:=\s*)?'
                  r'(?:31|flutter\.compileSdkVersion)\b',
                  replacement,
                  text,
              )

              if updated != text:
                  path.write_text(updated)
                  changed = True
                  print(f'Updated Agora compileSdk: {path}')
              else:
                  print(f'No compileSdk change needed in: {path}')

          if not changed:
              raise SystemExit(
                  'Agora compileSdk was not changed; inspect the package Gradle file'
              )
          PY
