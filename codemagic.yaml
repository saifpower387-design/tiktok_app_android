workflows:
  android-workflow:
    name: ST Video Android Firebase
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Create Android project
        script: |
          set -e
          mkdir -p "$HOME/.android"
          test -f signing/debug.keystore || {
            echo "ERROR: signing/debug.keystore is missing from GitHub"
            exit 1
          }
          cp signing/debug.keystore "$HOME/.android/debug.keystore"
          rm -rf android
          flutter create . --platforms=android
          cp signing/debug.keystore "$HOME/.android/debug.keystore"

      - name: Apply ST app icon
        script: |
          set -e

          icon_root="assets/app_icon"
          test -f "$icon_root/app_icon.png" || {
            echo "App icon assets are missing"
            exit 1
          }

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            target="android/app/src/main/res/mipmap-$density"
            mkdir -p "$target"
            cp "$icon_root/mipmap-$density/ic_launcher.png" "$target/ic_launcher.png"
            cp "$icon_root/mipmap-$density/ic_launcher_round.png" "$target/ic_launcher_round.png"
          done

          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          echo "Applied professional S/T launcher icon"

      - name: Force fixed Android signing key
        script: |
          set -e
          test -f signing/debug.keystore || {
            echo "signing/debug.keystore is missing from the repository"
            exit 1
          }
          cp signing/debug.keystore "$HOME/.android/debug.keystore"
          cp signing/debug.keystore android/app/debug.keystore

          python3 - <<'PY'
          from pathlib import Path

          paths = list(Path('android/app').glob('build.gradle*'))
          if not paths:
              raise SystemExit('Android app Gradle file not found')

          path = paths[0]
          text = path.read_text()
          if path.suffix == '.kts':
              signing = '''\n    signingConfigs {\n        getByName("debug") {\n            storeFile = rootProject.file("../signing/debug.keystore")\n            storePassword = "android"\n            keyAlias = "androiddebugkey"\n            keyPassword = "android"\n        }\n    }\n'''
              marker = 'rootProject.file("../signing/debug.keystore")'
          else:
              signing = '''\n    signingConfigs {\n        debug {\n            storeFile file("../signing/debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }\n'''
              marker = 'file("../signing/debug.keystore")'
          if marker not in text:
              text = text.replace('android {', 'android {' + signing, 1)
          if path.suffix == '.kts':
              assignment = '''\n    buildTypes {\n        getByName("debug") {\n            signingConfig = signingConfigs.getByName("debug")\n        }\n    }\n'''
          else:
              assignment = '''\n    buildTypes {\n        debug {\n            signingConfig signingConfigs.debug\n        }\n    }\n'''
          if 'signingConfig = signingConfigs.getByName("debug")' not in text and 'signingConfig signingConfigs.debug' not in text:
              text = text.replace('\n}', assignment + '\n}', 1)
          path.write_text(text)
          print(f'Gradle debug signing fixed to repository keystore: {path}')
          PY

      - name: Generate Google OAuth fingerprints
        script: |
          mkdir -p "$HOME/.android"

          test -f signing/debug.keystore || {
            echo "signing/debug.keystore is missing"
            exit 1
          }

          cp signing/debug.keystore "$HOME/.android/debug.keystore"

          echo "Copy these values to Firebase Project settings:"
          keytool -list -v \
            -alias androiddebugkey \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android | grep -E "SHA1:|SHA256:"

      - name: Fix Gradle wrapper version
        script: |
          python3 - <<'PY'
          from pathlib import Path

          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          if not wrapper.exists():
              raise SystemExit(f'Missing Gradle wrapper: {wrapper}')

          text = wrapper.read_text()
          import re
          text, count = re.subn(
              r'distributionUrl=.*',
              'distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip',
              text,
          )
          if count != 1:
              raise SystemExit('Could not update Gradle distributionUrl')
          wrapper.write_text(text)
          print('Gradle wrapper set to 9.3.1')
          PY

      - name: Update Android SDK versions in build.gradle
        script: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          
          for gradle_path in Path('android/app').glob('build.gradle*'):
              content = gradle_path.read_text()
              content = re.sub(r'compileSdk(Version)?\s*=?\s*.*', 'compileSdk = 36', content)
              content = re.sub(r'targetSdk(Version)?\s*=?\s*.*', 'targetSdk = 36', content)
              content = re.sub(r'minSdk(Version)?\s*=?\s*.*', 'minSdk = 24', content)
              gradle_path.write_text(content)
              print(f"Successfully updated {gradle_path}")
          PY

      - name: Configure Firebase Android
        script: |
          test -f google-services.json || { echo "google-services.json is missing"; exit 1; }
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('google-services.json').read_text())
          clients = data.get('client', [])
          android = [
              c for c in clients
              if c.get('client_info', {}).get('android_client_info', {}).get('package_name')
              == 'com.example.tiktok_app'
          ]
          if not android:
              raise SystemExit('google-services.json package mismatch')
          oauth = android[0].get('oauth_client', [])
          if not any(c.get('client_type') == 1 for c in oauth):
              raise SystemExit('google-services.json has no Android OAuth client')
          if not any(c.get('client_type') == 3 for c in oauth):
              raise SystemExit('google-services.json has no Web OAuth client')
          print('Firebase package and Android/Web OAuth clients verified')
          PY
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path

          def first_existing(*names):
              for n in names:
                  p = Path(n)
                  if p.exists():
                      return p
              raise SystemExit("Missing gradle file: " + " or ".join(names))

          def add_plugin(path, groovy_line, kts_line):
              text = path.read_text()
              if 'com.google.gms.google-services' in text:
                  return
              line = kts_line if path.suffix == '.kts' else groovy_line
              text = text.replace('plugins {', 'plugins {\n' + line, 1)
              path.write_text(text)

          add_plugin(
              first_existing('android/settings.gradle.kts', 'android/settings.gradle'),
              '    id "com.google.gms.google-services" version "4.4.2" apply false',
              '    id("com.google.gms.google-services") version "4.4.2" apply false',
          )
          add_plugin(
              first_existing('android/app/build.gradle.kts', 'android/app/build.gradle'),
              '    id "com.google.gms.google-services"',
              '    id("com.google.gms.google-services")',
          )
          PY

      - name: Add Agora permissions
        script: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'RECORD_AUDIO' not in text:
              perms = (
                  '    <uses-permission android:name="android.permission.INTERNET"/>\n'
                  '    <uses-permission android:name="android.permission.CAMERA"/>\n'
                  '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
                  '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n'
                  '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n'
                  '    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n'
              )
              text = text.replace('<application', perms + '    <application', 1)
              manifest.write_text(text)
          PY

      - name: Get packages
        script: flutter pub get

      - name: Fix Agora compileSdk
        script: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          candidates = list(Path.home().glob('.pub-cache/hosted/**/agora_rtc_engine-*/android/build.gradle*'))
          if not candidates:
              raise SystemExit('Could not find Agora Android Gradle file')

          changed = False
          for path in candidates:
              text = path.read_text()
              if path.suffix == '.kts':
                  updated = re.sub(
                      r'(?m)^(\s*)compileSdk\s*=.*$',
                      r'\1compileSdk = 36',
                      text,
                  )
              else:
                  updated = re.sub(
                      r'(?m)^(\s*)compileSdk(?:Version)?\s+.*$',
                      r'\1compileSdkVersion 36',
                      text,
                  )
              if updated != text:
                  changed = True
                  path.write_text(updated)
                  print(f'Updated Agora compileSdk: {path}')
              else:
                  print(f'No compileSdk change needed in: {path}')
          if not changed:
              raise SystemExit('Agora compileSdk was not changed; inspect the package Gradle file')
          PY

      - name: Force iris_method_channel compileSdk 36
        script: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          files = list(
              Path.home().glob(
                  '.pub-cache/hosted/**/iris_method_channel-*/android/build.gradle*'
              )
          )

          if not files:
              raise SystemExit('iris_method_channel Gradle file not found')

          for path in files:
              text = path.read_text()

              if path.suffix == '.kts':
                  updated = re.sub(
                      r'(?m)^(\s*)compileSdk\s*=.*$',
                      r'\1compileSdk = 36',
                      text,
                  )
              else:
                  updated = re.sub(
                      r'(?m)^(\s*)compileSdkVersion\s+.*$',
                      r'\1compileSdkVersion 36',
                      text,
                  )

              if updated == text:
                  raise SystemExit(
                      f'Could not update compileSdk in {path}'
                  )

              path.write_text(updated)
              print(f'Updated iris_method_channel: {path}')
              for line_number, line in enumerate(updated.splitlines(), 1):
                  if 'compileSdk' in line:
                      print(f'{line_number}: {line}')
          PY

      - name: Build debug APK
        script: flutter build apk --debug

      - name: Verify APK signing fingerprint
        script: |
          set -e
          APK="build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$APK" || { echo "APK was not created"; exit 1; }
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          test -x "$APKSIGNER" || { echo "Android apksigner was not found"; exit 1; }
          echo "The APK was signed with this certificate; these exact values must exist in Firebase:"
          CERTS=$("$APKSIGNER" verify --print-certs "$APK")
          echo "$CERTS"
          echo "$CERTS" | grep -qi "1f:23:35:68:5d:a1:be:46:dc:a9:56:de:4e:50:9b:0b:7e:a0:44:22" || {
            echo "ERROR: APK was not signed with the fixed Firebase key"
            exit 1
          }
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
