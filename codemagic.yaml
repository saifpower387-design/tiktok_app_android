workflows:
  android-workflow:
    name: ST Video Android Firebase
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Create Android project
        script: |
          rm -rf android
          flutter create . --platforms=android

      - name: Force write build.gradle with SDK 34
        script: |
          python3 - <<'PY'
          from pathlib import Path
          gradle_path = Path('android/app/build.gradle')
          if gradle_path.exists():
              content = gradle_path.read_text()
              # تعديل القيم مباشرة بضمان تام
              content = content.replace('compileSdkVersion flutter.compileSdkVersion', 'compileSdk = 34')
              content = content.replace('targetSdkVersion flutter.targetSdkVersion', 'targetSdk = 34')
              content = content.replace('minSdkVersion flutter.minSdkVersion', 'minSdk = 24')
              # لو الملف يستخدم الصيغة الحديثة أو القديمة
              if 'compileSdk ' not in content:
                  content = content.replace('android {', 'android {\n    compileSdk = 34\n    targetSdk = 34\n')
              else:
                  content = content.replace('compileSdk = 31', 'compileSdk = 34')
                  content = content.replace('targetSdk = 31', 'targetSdk = 34')
              gradle_path.write_text(content)
              print("Updated build.gradle successfully!")
          PY

      - name: Configure Firebase Android
        script: |
          test -f google-services.json || { echo "google-services.json is missing"; exit 1; }
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path

          def first_existing(*names):
              for n in names:
                  p = Path(n)
                  if p.exists():
                      return p
              raise SystemExit("Missing gradle file: " + " or ".join(names))

          def add_plugin(path, groovy_line, kts_line):
              text = path.read_text()
              if 'com.google.gms.google-services' in text:
                  return
              line = kts_line if path.suffix == '.kts' else groovy_line
              text = text.replace('plugins {', 'plugins {\n' + line, 1)
              path.write_text(text)

          add_plugin(
              first_existing('android/settings.gradle.kts', 'android/settings.gradle'),
              '    id "com.google.gms.google-services" version "4.4.2" apply false',
              '    id("com.google.gms.google-services") version "4.4.2" apply false',
          )
          add_plugin(
              first_existing('android/app/build.gradle.kts', 'android/app/build.gradle'),
              '    id "com.google.gms.google-services"',
              '    id("com.google.gms.google-services")',
          )
          PY

      - name: Add Agora permissions
        script: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'RECORD_AUDIO' not in text:
              perms = (
                  '    <uses-permission android:name="android.permission.INTERNET"/>\n'
                  '    <uses-permission android:name="android.permission.CAMERA"/>\n'
                  '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
                  '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n'
                  '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n'
                  '    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n'
              )
              text = text.replace('<application', perms + '    <application', 1)
              manifest.write_text(text)
          PY

      - name: Get packages
        script: flutter pub get

      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
