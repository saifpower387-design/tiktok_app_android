workflows:
  android-workflow:
    name: ST Video Android Firebase
    instance_type: mac_mini_m1

    environment:
      flutter: stable

    scripts:
      - name: Create Android project
        script: |
          rm -rf android
          flutter create . --platforms=android

      - name: Fix Gradle wrapper version
        script: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          wrapper = Path("android/gradle/wrapper/gradle-wrapper.properties")

          if not wrapper.exists():
              raise SystemExit(f"Missing Gradle wrapper: {wrapper}")

          text = wrapper.read_text()

          text, count = re.subn(
              r"distributionUrl=.*",
              "distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip",
              text,
           )

          if count != 1:
              raise SystemExit("Could not update Gradle distributionUrl")

          wrapper.write_text(text)
          print("Gradle wrapper set to 9.3.1")
          PY

      - name: Update Android SDK versions
        script: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          for gradle_path in Path("android/app").glob("build.gradle*"):
              content = gradle_path.read_text()

              if gradle_path.suffix == ".kts":
                  content = re.sub(
                      r"compileSdk\s*=.*",
                      "compileSdk = 36",
                      content,
                  )
                  content = re.sub(
                      r"targetSdk\s*=.*",
                      "targetSdk = 36",
                      content,
                  )
                  content = re.sub(
                      r"minSdk\s*=.*",
                      "minSdk = 24",
                      content,
                  )
              else:
                  content = re.sub(
                      r"compileSdkVersion\s+.*",
                      "compileSdkVersion 36",
                      content,
                  )
                  content = re.sub(
                      r"targetSdkVersion\s+.*",
                      "targetSdkVersion 36",
                      content,
                  )
                  content = re.sub(
                      r"minSdkVersion\s+.*",
                      "minSdkVersion 24",
                      content,
                  )

              gradle_path.write_text(content)
              print(f"Updated Android SDK versions in {gradle_path}")
          PY

      - name: Configure Firebase Android
        script: |
          test -f google-services.json || {
            echo "google-services.json is missing"
            exit 1
          }

          mkdir -p android/app
          cp google-services.json android/app/google-services.json

          python3 - <<'PY'
          from pathlib import Path

          def first_existing(*names):
              for name in names:
                  path = Path(name)
                  if path.exists():
                      return path

              raise SystemExit(
                  "Missing gradle file: " + " or ".join(names)
              )

          def add_plugin(path, groovy_line, kts_line):
              text = path.read_text()

              if "com.google.gms.google-services" in text:
                  return

              line = kts_line if path.suffix == ".kts" else groovy_line
              text = text.replace(
                  "plugins {",
                  "plugins {\n" + line,
                  1,
              )

              path.write_text(text)

          add_plugin(
              first_existing(
                  "android/settings.gradle.kts",
                  "android/settings.gradle",
              ),
              '    id "com.google.gms.google-services" version "4.4.2" apply false',
              '    id("com.google.gms.google-services") version "4.4.2" apply false',
          )

          add_plugin(
              first_existing(
                  "android/app/build.gradle.kts",
                  "android/app/build.gradle",
              ),
              '    id "com.google.gms.google-services"',
              '    id("com.google.gms.google-services")',
          )
          PY

      - name: Add Agora permissions
        script: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          if "android.permission.RECORD_AUDIO" not in text:
              permissions = """    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              """

              text = text.replace(
                  "<application",
                  permissions + "    <application",
                  1,
              )

              manifest.write_text(text)
          PY

      - name: Get packages
        script: flutter pub get

      - name: Fix Agora compileSdk
        script: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          candidates = list(
              Path.home().glob(
                  ".pub-cache/hosted/**/agora_rtc_engine-*/android/build.gradle*"
              )
          )

          if not candidates:
              raise SystemExit(
                  "Could not find Agora Android Gradle file"
              )

          changed = False

          for path in candidates:
              text = path.read_text()

              if path.suffix == ".kts":
                  replacement = "compileSdk = 36"
              else:
                  replacement = "compileSdkVersion 36"

              updated = re.sub(
                  r"compileSdk(?:Version)?\s*(?:=\s*)?"
                  r"(?:31|flutter\.compileSdkVersion)\b",
                  replacement,
                  text,
              )

              if updated != text:
                  path.write_text(updated)
                  changed = True
                  print(f"Updated Agora compileSdk: {path}")
              else:
                  print(f"No compileSdk change needed in: {path}")

          if not changed:
              raise SystemExit(
                  "Agora compileSdk was not changed; inspect the package Gradle file"
              )
          PY

      - name: Build debug APK
        script: flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
