workflows:
  android-workflow:
    name: ST Video Android Firebase
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Create Android project
        script: |
          rm -rf android
          flutter create . --platforms=android --org com.example --project-name tiktok_app

      - name: Fix Gradle, AGP, SDK versions, and package name
        script: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          # ===== 1. تحديث Android Gradle Plugin و Kotlin في build.gradle الرئيسي =====
          root_gradle = Path('android/build.gradle')
          if root_gradle.exists():
              text = root_gradle.read_text()
              # AGP
              text = re.sub(
                  r'com\.android\.tools\.build:gradle:[^\s"\']+',
                  'com.android.tools.build:gradle:8.6.0',
                  text
              )
              # Kotlin
              text = re.sub(
                  r'org\.jetbrains\.kotlin:kotlin-gradle-plugin:[^\s"\']+',
                  'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.20',
                  text
              )
              root_gradle.write_text(text)
              print("✅ Updated root build.gradle")

          # Root build.gradle.kts (لو موجود)
          root_gradle_kts = Path('android/build.gradle.kts')
          if root_gradle_kts.exists():
              text = root_gradle_kts.read_text()
              text = re.sub(
                  r'com\.android\.tools\.build:gradle:[^\s"\']+',
                  'com.android.tools.build:gradle:8.6.0',
                  text
              )
              root_gradle_kts.write_text(text)
              print("✅ Updated root build.gradle.kts")

          # ===== 2. تحديث Gradle wrapper =====
          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          if wrapper.exists():
              text = wrapper.read_text()
              text = re.sub(
                  r'distributionUrl=.*',
                  'distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-all.zip',
                  text
              )
              wrapper.write_text(text)
              print("✅ Updated gradle-wrapper.properties to 8.9")

          # ===== 3. تحديث SDK versions + namespace + applicationId =====
          for gradle_path in Path('android/app').glob('build.gradle*'):
              content = gradle_path.read_text()

              # compileSdk / targetSdk / minSdk
              content = re.sub(r'compileSdk(Version)?\s*=?\s*\d+', 'compileSdk = 35', content)
              content = re.sub(r'targetSdk(Version)?\s*=?\s*\d+', 'targetSdk = 35', content)
              content = re.sub(r'minSdk(Version)?\s*=?\s*\d+', 'minSdk = 24', content)

              # namespace + applicationId لضمان مطابقة google-services.json
              content = re.sub(
                  r'namespace\s*=?\s*["\'][^"\']+["\']',
                  'namespace = "com.example.tiktok_app"',
                  content
              )
              content = re.sub(
                  r'applicationId\s*=?\s*["\'][^"\']+["\']',
                  'applicationId = "com.example.tiktok_app"',
                  content
              )

              gradle_path.write_text(content)
              print(f"✅ Updated {gradle_path}")

          # ===== 4. تحديث AndroidManifest package (لو موجود) =====
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          if manifest.exists():
              m = manifest.read_text()
              m = re.sub(r'package="[^"]+"', 'package="com.example.tiktok_app"', m)
              manifest.write_text(m)

          # ===== 5. تعديل MainActivity package path =====
          main_activity_dirs = list(Path('android/app/src/main').rglob('MainActivity.kt'))
          for ma in main_activity_dirs:
              content = ma.read_text()
              content = re.sub(r'^package\s+.*', 'package com.example.tiktok_app', content, count=1, flags=re.M)
              ma.write_text(content)

              # نقل الملف للمسار الصحيح
              target_dir = Path('android/app/src/main/kotlin/com/example/tiktok_app')
              target_dir.mkdir(parents=True, exist_ok=True)
              target = target_dir / 'MainActivity.kt'
              if ma != target:
                  target.write_text(content)
                  ma.unlink()
              print(f"✅ Fixed MainActivity at {target}")
          PY

      - name: Configure Firebase Android
        script: |
          test -f google-services.json || { echo "google-services.json is missing"; exit 1; }
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path

          def first_existing(*names):
              for n in names:
                  p = Path(n)
                  if p.exists():
                      return p
              raise SystemExit("Missing gradle file: " + " or ".join(names))

          def add_plugin(path, groovy_line, kts_line):
              text = path.read_text()
              if 'com.google.gms.google-services' in text:
                  return
              line = kts_line if path.suffix == '.kts' else groovy_line
              text = text.replace('plugins {', 'plugins {\n' + line, 1)
              path.write_text(text)

          add_plugin(
              first_existing('android/settings.gradle.kts', 'android/settings.gradle'),
              '    id "com.google.gms.google-services" version "4.4.2" apply false',
              '    id("com.google.gms.google-services") version "4.4.2" apply false',
          )
          add_plugin(
              first_existing('android/app/build.gradle.kts', 'android/app/build.gradle'),
              '    id "com.google.gms.google-services"',
              '    id("com.google.gms.google-services")',
          )
          PY

      - name: Add Agora permissions
        script: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'RECORD_AUDIO' not in text:
              perms = (
                  '    <uses-permission android:name="android.permission.INTERNET"/>\n'
                  '    <uses-permission android:name="android.permission.CAMERA"/>\n'
                  '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
                  '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n'
                  '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n'
                  '    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n'
              )
              text = text.replace('<application', perms + '    <application', 1)
              manifest.write_text(text)
          PY

      - name: Get packages
        script: flutter pub get

      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
