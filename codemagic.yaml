workflows:
  android-workflow:
    name: ST Video Android Firebase
    instance_type: mac_mini_m1
    environment:
      flutter: stable
    scripts:
      - name: Create Android project
        script: |
          rm -rf android
          flutter create . --platforms=android

      - name: Generate Google OAuth fingerprints
        script: |
          mkdir -p "$HOME/.android"

          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Copy these values to Firebase Project settings:" 
          keytool -list -v \
            -alias androiddebugkey \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -keypass android | grep -E "SHA1:|SHA256:"

      - name: Fix Gradle wrapper version
        script: |
          python3 - <<'PY'
          from pathlib import Path

          wrapper = Path('android/gradle/wrapper/gradle-wrapper.properties')
          if not wrapper.exists():
              raise SystemExit(f'Missing Gradle wrapper: {wrapper}')

          text = wrapper.read_text()
          import re
          text, count = re.subn(
              r'distributionUrl=.*',
              'distributionUrl=https\\://services.gradle.org/distributions/gradle-9.3.1-bin.zip',
              text,
          )
          if count != 1:
              raise SystemExit('Could not update Gradle distributionUrl')
          wrapper.write_text(text)
          print('Gradle wrapper set to 9.3.1')
          PY

      - name: Update Android SDK versions in build.gradle
        script: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          
          for gradle_path in Path('android/app').glob('build.gradle*'):
              content = gradle_path.read_text()
              content = re.sub(r'compileSdk(Version)?\s*=?\s*.*', 'compileSdk = 36', content)
              content = re.sub(r'targetSdk(Version)?\s*=?\s*.*', 'targetSdk = 36', content)
              content = re.sub(r'minSdk(Version)?\s*=?\s*.*', 'minSdk = 24', content)
              gradle_path.write_text(content)
              print(f"Successfully updated {gradle_path}")
          PY

      - name: Configure Firebase Android
        script: |
          test -f google-services.json || { echo "google-services.json is missing"; exit 1; }
          cp google-services.json android/app/google-services.json
          python3 - <<'PY'
          from pathlib import Path

          def first_existing(*names):
              for n in names:
                  p = Path(n)
                  if p.exists():
                      return p
              raise SystemExit("Missing gradle file: " + " or ".join(names))

          def add_plugin(path, groovy_line, kts_line):
              text = path.read_text()
              if 'com.google.gms.google-services' in text:
                  return
              line = kts_line if path.suffix == '.kts' else groovy_line
              text = text.replace('plugins {', 'plugins {\n' + line, 1)
              path.write_text(text)

          add_plugin(
              first_existing('android/settings.gradle.kts', 'android/settings.gradle'),
              '    id "com.google.gms.google-services" version "4.4.2" apply false',
              '    id("com.google.gms.google-services") version "4.4.2" apply false',
          )
          add_plugin(
              first_existing('android/app/build.gradle.kts', 'android/app/build.gradle'),
              '    id "com.google.gms.google-services"',
              '    id("com.google.gms.google-services")',
          )
          PY

      - name: Add Agora permissions
        script: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          if 'RECORD_AUDIO' not in text:
              perms = (
                  '    <uses-permission android:name="android.permission.INTERNET"/>\n'
                  '    <uses-permission android:name="android.permission.CAMERA"/>\n'
                  '    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n'
                  '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n'
                  '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n'
                  '    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>\n'
              )
              text = text.replace('<application', perms + '    <application', 1)
              manifest.write_text(text)
          PY

      - name: Get packages
        script: flutter pub get

      - name: Fix Agora compileSdk
        script: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          candidates = list(Path.home().glob('.pub-cache/hosted/**/agora_rtc_engine-*/android/build.gradle*'))
          if not candidates:
              raise SystemExit('Could not find Agora Android Gradle file')

          changed = False
          for path in candidates:
              text = path.read_text()
              if path.suffix == '.kts':
                  updated = re.sub(
                      r'(?m)^(\s*)compileSdk\s*=.*$',
                      r'\1compileSdk = 36',
                      text,
                  )
              else:
                  updated = re.sub(
                      r'(?m)^(\s*)compileSdk(?:Version)?\s+.*$',
                      r'\1compileSdkVersion 36',
                      text,
                  )
              if updated != text:
                  changed = True
                  path.write_text(updated)
                  print(f'Updated Agora compileSdk: {path}')
              else:
                  print(f'No compileSdk change needed in: {path}')
          if not changed:
              raise SystemExit('Agora compileSdk was not changed; inspect the package Gradle file')
          PY

      - name: Force iris_method_channel compileSdk 36
        script: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          files = list(
              Path.home().glob(
                  '.pub-cache/hosted/**/iris_method_channel-*/android/build.gradle*'
              )
          )

          if not files:
              raise SystemExit('iris_method_channel Gradle file not found')

          for path in files:
              text = path.read_text()

              if path.suffix == '.kts':
                  updated = re.sub(
                      r'(?m)^(\s*)compileSdk\s*=.*$',
                      r'\1compileSdk = 36',
                      text,
                  )
              else:
                  updated = re.sub(
                      r'(?m)^(\s*)compileSdkVersion\s+.*$',
                      r'\1compileSdkVersion 36',
                      text,
                  )

              if updated == text:
                  raise SystemExit(
                      f'Could not update compileSdk in {path}'
                  )

              path.write_text(updated)
              print(f'Updated iris_method_channel: {path}')
              for line_number, line in enumerate(updated.splitlines(), 1):
                  if 'compileSdk' in line:
                      print(f'{line_number}: {line}')
          PY

      - name: Build debug APK
        script: flutter build apk --debug
    artifacts:
      - build/app/outputs/flutter-apk/app-debug.apk
